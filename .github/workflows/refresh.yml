name: Refresh Data

# Runs on GitHub's own `schedule` trigger, four times a day. GitHub treats
# `schedule` as best-effort and drops some ticks under load (the sibling news-hub
# project measured roughly half of them hitting), so four ticks a day is meant to
# guarantee that at least one or two land. That is plenty for a site that is not
# news. Extra ticks are cheap: fetch.py only calls the API for channels that are
# overdue (see DEFAULT_CADENCE_HOURS), so a run right after a successful one
# does almost nothing. See docs/refresh-schedule.md.
on:
  schedule:
    # UTC. Minute 17 rather than :00 - the top of the hour is when GitHub's
    # scheduler is busiest and most likely to delay or drop a run.
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:        # manual "Run workflow" button in the Actions tab
  # Editing the channel list or the sections on GitHub re-runs the build and the fetch at once, so a new
  # channel or section shows up in minutes instead of waiting for the next tick. The workflow's own data
  # commits do not trigger this (GitHub does not start workflows from commits made with GITHUB_TOKEN).
  push:
    branches: [main]
    paths:
      - data/portal_sources.csv
      - data/sections.json
      - scripts/build_pages.py
      - scripts/channels.py

# Never let a manual run and a scheduled run (or two scheduled runs) overlap.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit updated JSON files

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # A manually re-run workflow can start from an older commit. Sync first
      # so the fetch and its cache use the newest generated data.
      - name: Sync latest data
        run: git pull --rebase origin main

      # Pages are generated from the CSV + sections.json, so they are rebuilt on every run. Standard library
      # only; nothing to install, no API calls. Commits only if a page actually changed.
      - name: Build pages
        run: python scripts/build_pages.py

      - name: Fetch YouTube videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch.py

      # Independent of the YouTube step: a feed failure must not lose the
      # videos, and a quota failure must not lose the posts.
      - name: Fetch written feeds
        if: always()
        run: python scripts/fetch_written.py

      - name: Commit updated data
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/videos.json data/channels_meta.json data/video_id_cache.json data/periodic_state.json data/posts.json 2>/dev/null || true
          # generated pages (-A also stages deletions of pages of removed sections); player.html is hand-written and unchanged
          git add -A -- '*.html'
          git diff --staged --quiet || git commit -m "chore: refresh data"
          # Another refresh can finish while this one is fetching. On a
          # generated-data conflict, keep this run's newer generated data.
          git pull --rebase -X theirs origin main
          git push

      # Runs after the data is committed, so a topics problem can never block a data
      # refresh - but it turns the run red so a broken Topics tab does not go unnoticed.
      # No dependencies: scripts/check_topics.js only uses Node's standard library.
      - name: Set up Node (for the topics check)
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Topics unit tests
        if: always()
        run: node scripts/test_topics_unit.js

      - name: Topics data check
        if: always()
        run: node scripts/check_topics.js
